apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-banco
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-banco
  template:
    metadata:
      labels:
        app: frontend-banco
    spec:
      containers:
      - name: frontend
        image: mi-banco-frontend:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend-banco
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
